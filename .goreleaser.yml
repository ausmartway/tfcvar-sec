# Make sure to check the documentation at https://goreleaser.com
version: 2
before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 6
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
    ldflags:
      - -X version.Version={{.Tag}} -X version.PackageManager=goreleaser

universal_binaries:
  - replace: false

dockers:
  - image_templates:
      - "ausmartwayhashi/tfcvar-sec:latest"
      - "ausmartwayhashi/tfcvar-sec:{{ .Version }}-amd64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"

  - image_templates:
      - "ausmartwayhashi/tfcvar-sec:{{ .Version }}-arm64"
    use: buildx
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64/v8"

  - image_templates:
      - "ausmartwayhashi/tfcvar-sec:{{ .Version }}-armv7"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm/v7"

  - image_templates:
      - "ausmartwayhashi/tfcvar-sec:{{ .Version }}-armv6"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm/v6"

docker_manifests:
  - name_template: ausmartwayhashi/tfcvar-sec:latest
    image_templates:
      - ausmartwayhashi/tfcvar-sec:{{ .Version }}-amd64
      - ausmartwayhashi/tfcvar-sec:{{ .Version }}-arm64
      - ausmartwayhashi/tfcvar-sec:{{ .Version }}-armv7
      - ausmartwayhashi/tfcvar-sec:{{ .Version }}-armv6

archives:
  - formats:
      - tar.gz

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

homebrew_casks:
  - name: tfcvar-sec
    repository:
      owner: ausmartway
      name: homebrew-tfcvar-sec
    commit_author:
      name: Yulei Liu
      email: yulei.liu@gmail.com
    caveats: "Type 'tfcvar-sec scan' on your command line."
    homepage: "https://github.com/ausmartway/tfcvar-sec"
    description: "The tfcvar-sec is a tool that scans Terraform Cloud for insecure terraform/environment variables."
    skip_upload: false
